# Netlify configuration for Mirage Vision PWA

[build]
  publish = "."

# Headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=()"

# Required for SharedArrayBuffer (WASM performance)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# WASM files — immutable, long cache
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"

# .cact model files — immutable, long cache
[[headers]]
  for = "*.cact"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"

# JS files — moderate cache
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Cross-Origin-Resource-Policy = "cross-origin"

# CSS files
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Service worker — no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store"

# HTML — short cache
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
